<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAJA</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #050505;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    width: 500px;
    height: 500px;
    background: #6a00ff;
    filter: blur(180px);
    opacity: 0.35;
    border-radius: 50%;
}

.container {
    position: relative;
    z-index: 2;
    padding: 30px;
}

.logo {
    font-size: clamp(70px, 20vw, 150px);
    font-weight: 900;
    letter-spacing: 15px;
    background: linear-gradient(90deg, #fff, #8b5cf6, #00e5ff);
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 35px rgba(139,92,246,.5);
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from {
        filter: drop-shadow(0 0 5px #8b5cf6);
    }
    to {
        filter: drop-shadow(0 0 25px #00e5ff);
    }
}

.tagline {
    margin-top: 15px;
    font-size: 18px;
    color: #bbb;
    letter-spacing: 4px;
}

.btn {
    display: inline-block;
    margin-top: 35px;
    padding: 15px 35px;
    border: 1px solid #8b5cf6;
    border-radius: 50px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: .3s;
    box-shadow: 0 0 15px rgba(139,92,246,.3);
}

.btn:hover {
    transform: scale(1.08);
    background: #8b5cf6;
    box-shadow: 0 0 30px #8b5cf6;
}

.card {
    margin-top: 45px;
    padding: 25px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px;
    background: rgba(255,255,255,.05);
    backdrop-filter: blur(10px);
}

.card h2 {
    margin-bottom: 10px;
}

.card p {
    color: #aaa;
    line-height: 1.6;
}

footer {
    margin-top: 30px;
    color: #666;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">RAJA</div>

    <div class="tagline">
        WELCOME TO MY WORLD
    </div>

    <a class="btn" href="#about">
        ENTER WEBSITE
    </a>

    <div class="card" id="about">
        <h2>👑 ABOUT RAJA</h2>
        <p>
            Welcome to the official RAJA website.
            <br>
            This is my own little world on the internet.
        </p>
    </div>

    <footer>
        © 2026 RAJA • All Rights Reserved
    </footer>

</div>

</body>
</html>
